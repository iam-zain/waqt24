name: Build and test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build (src/*.js -> app.js, version stamps)
        run: python3 tools/build.py
      - name: Smoke test (every screen opens, zero JS errors)
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python3 tools/smoke.py
      - name: Commit rebuilt files if they changed
        run: |
          if [ -n "$(git status --porcelain app.js index.html sw.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js index.html sw.js
            git commit -m "Rebuild app.js and version stamps [skip ci]"
            git push
          else
            echo "Built files already up to date."
          fi
