<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>Namaz Timer</title>
<style>
:root{
  --bg:#0d1420; --bg2:#131c2b; --card:#16202f; --card2:#1b2635;
  --text:#e9edf3; --sub:#7c8ba0; --line:#232f42; --dotBorder:#3d4c68;
  --fard:#3a9bd9; --fardText:#06131f;
  --nafil:#8b7fd6; --special:#c99a4a; --meal:#3fa8a0;
  --green:#3fae6a; --yellow:#d4a72c; --red:#c85a4a; --roza:#c3b6ea;
  --accent:#3a9bd9;
  --meterBg:#1e293a;
  --tabbar:#0f1826;
  transition:background .6s ease, color .6s ease;
}
[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#ffffff; --card:#ffffff; --card2:#f0f2f5;
  --text:#1c2530; --sub:#67748a; --line:#e3e7ed; --dotBorder:#b6c0cc;
  --fard:#256fa8; --fardText:#ffffff;
  --nafil:#6c5ec4; --special:#a8762a; --meal:#1f8f83; --roza:#8a6fcf;
  --meterBg:#e7eaef;
  --tabbar:#ffffff;
}

/* ---------- WAQTI (prayer-time ambient) THEMES ---------- */
[data-theme="waqt-morning"]{ /* Fajr - soft dawn light */
  --bg:#eef1f7; --bg2:#ffffff; --card:#ffffff; --card2:#f2f4f9;
  --text:#26314a; --sub:#697490; --line:#dde2ee; --dotBorder:#b3bdd4;
  --fard:#3f6fbf; --nafil:#7d6ec9; --special:#b8813f; --meal:#2f8f8a; --roza:#8a6fcf;
  --meterBg:#e2e6f1; --tabbar:#ffffff; --accent:#3f6fbf;
}
[data-theme="waqt-bright"]{ /* Zuhr / midday - bright */
  --bg:#fbfaf5; --bg2:#ffffff; --card:#ffffff; --card2:#f7f4ea;
  --text:#2a2718; --sub:#847c60; --line:#ece5cf; --dotBorder:#cabb8c;
  --fard:#b98a26; --nafil:#8267c2; --special:#b0602a; --meal:#2f8f8a; --roza:#8a6fcf;
  --meterBg:#f0ead6; --tabbar:#ffffff; --accent:#b98a26;
}
[data-theme="waqt-dim"]{ /* Asr - soft dimming afternoon */
  --bg:#eee8df; --bg2:#f8f4ec; --card:#f8f4ec; --card2:#efe7d9;
  --text:#362e23; --sub:#867a67; --line:#ded2bd; --dotBorder:#b7a37e;
  --fard:#a3612f; --nafil:#7c5f9c; --special:#b06229; --meal:#2f8f8a; --roza:#7d64ba;
  --meterBg:#e4d9c5; --tabbar:#f8f4ec; --accent:#a3612f;
}
[data-theme="waqt-grey"]{ /* Maghrib approach / dusk grey */
  --bg:#565b62; --bg2:#61666d; --card:#61666d; --card2:#54595f;
  --text:#f1efec; --sub:#c3c5c9; --line:#727782; --dotBorder:#9198a3;
  --fard:#cf8158; --nafil:#b892d1; --special:#d3a655; --meal:#5dc4b8; --roza:#c9b8f0;
  --meterBg:#4a4f55; --tabbar:#4a4f55; --accent:#cf8158;
}
[data-theme="waqt-dark"]{ /* Isha - dark blue night */
  --bg:#121a2c; --bg2:#182236; --card:#182236; --card2:#1d2940;
  --text:#e2e6f2; --sub:#8791ac; --line:#293450; --dotBorder:#48587f;
  --fard:#5182cf; --nafil:#9878d9; --special:#c99349; --meal:#4bbcae; --roza:#b9a8e8;
  --meterBg:#212b45; --tabbar:#0e1526; --accent:#5182cf;
}
[data-theme="waqt-darkest"]{ /* Tahajjud / last third - deep night */
  --bg:#050810; --bg2:#0a0e1a; --card:#0a0e1a; --card2:#0e1524;
  --text:#d5daea; --sub:#5b6482; --line:#161d2f; --dotBorder:#333f5c;
  --fard:#3d63b3; --nafil:#7256b0; --special:#ac7d3a; --meal:#3f9d92; --roza:#a892e0;
  --meterBg:#131a2a; --tabbar:#03050b; --accent:#3d63b3;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html,body{ height:100%; width:100%; overflow:hidden; }
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; justify-content:center;
}
#app{
  width:100%; max-width:560px; height:100vh; height:100dvh; display:flex; flex-direction:column;
  background:var(--bg); position:relative;
}
.screen{ flex:1; min-height:0; display:none; }
.screen.active{ display:flex; flex-direction:column; }
#tab-home.active{ display:flex; }
.scrollable{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
.scrollable::-webkit-scrollbar{width:0px;}

/* ---------- HOME (non-scrollable) ---------- */
#tab-home{ padding:12px 16px 6px; justify-content:flex-start; gap:8px; }
.date-bar{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:8px 4px 12px; border-bottom:1px solid var(--line);
}
.date-bar .greg{ font-size:15.5px; color:var(--sub); font-weight:600; }
.date-bar .hijri{ font-size:16px; color:var(--accent); font-weight:700; margin-top:4px; }
.dateNav{
  width:34px; height:34px; flex:0 0 auto; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--text); font-size:17px; cursor:pointer;
}
.dateCenter{ flex:1; text-align:center; cursor:pointer; }
.cityLabel{ font-size:15px; color:var(--sub); margin-top:4px; }
.controlBar{
  display:flex; align-items:stretch;
  padding:8px 2px; margin-top:2px; border-bottom:1px solid var(--line);
}
.controlCol{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; padding:3px; gap:6px; min-width:0; }
.controlCol.bulkCol{ flex:1; gap:5px; }
.controlDivider{ width:1px; background:var(--line); margin:2px 0; }
.bulkLabel{ font-size:12.5px; color:var(--sub); font-weight:600; white-space:nowrap; }
.bulkBtns{ display:flex; gap:5px; transition:opacity .2s; flex:0 0 auto; }
.bulkBtns.disabled{ opacity:0.3; pointer-events:none; filter:grayscale(0.6); }
.bulk-btn{
  width:25px; height:25px; border-radius:50%; border:1.5px solid transparent; cursor:pointer;
  font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; color:#fff; flex:0 0 auto;
}
.bulk-green{ background:var(--green); }
.bulk-yellow{ background:var(--yellow); color:#2b2100; }
.bulk-red{ background:var(--red); }
.bulk-clear{ background:transparent; border-color:var(--dotBorder, var(--line)); color:var(--sub); font-size:16px; }
.roza-mini{
  width:40px; height:23px; border-radius:12px; background:var(--meterBg);
  position:relative; cursor:pointer; border:1px solid var(--line); flex:0 0 auto;
}
.roza-mini.on{ background:var(--roza); border-color:var(--roza); }
.roza-mini-knob{ width:17px; height:17px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left .15s; }
.roza-mini.on .roza-mini-knob{ left:20px; }
.dateCenter .todayTag{ display:inline-block; margin-left:6px; padding:2px 8px; border-radius:8px; background:var(--accent); color:var(--fardText); font-size:11px; font-weight:700; vertical-align:middle; }

.times-list{
  flex:1; display:flex; flex-direction:column; justify-content:flex-start; gap:clamp(4px, 1.6dvh, 20px);
  padding:4px 0; min-height:0; overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:transparent transparent; transition:scrollbar-color .5s ease .5s;
}
.times-list.scrolling{ scrollbar-color:var(--dotBorder, var(--line)) transparent; transition:none; }
.times-list::-webkit-scrollbar{ width:4px; }
.times-list::-webkit-scrollbar-thumb{ background:transparent; transition:background .5s ease .5s; }
.times-list.scrolling::-webkit-scrollbar-thumb{ background:var(--dotBorder, var(--line)); transition:none; }
.times-list::-webkit-scrollbar-track{ background:transparent; }
.time-row{
  display:flex; flex-direction:column; gap:2px;
  padding:5px 8px; border-radius:9px; position:relative;
  min-height:42px; justify-content:center;
}
.time-row .rowMain{ display:flex; align-items:center; gap:6px; }
.time-row .remainText{ font-size:14px; text-align:right; padding-right:2px; line-height:18px; }
.time-row .remainText.remainPlaceholder{ visibility:hidden; }
.time-row .remainLabel{ color:var(--sub); font-weight:400; opacity:0.75; }
.time-row .remainValue{ color:var(--text); font-weight:800; }
.time-row .name{ font-size:14px; font-weight:600; flex:0 0 162px; min-width:0; display:flex; align-items:center; gap:5px; cursor:pointer; }
.time-row .name .nameTxt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.pIcon{ font-size:17px; line-height:1; flex:0 0 auto; }
.time-row .clock{ font-size:13px; font-variant-numeric:tabular-nums; flex:0 0 auto; color:var(--sub); letter-spacing:-0.3px; white-space:nowrap; }
.time-row .clock .arrow{ opacity:0.5; margin:0 2px; font-size:12px; }
.time-row.current .clock{ color:var(--text); font-weight:600; }
.time-row .meterWrap{ flex:1; height:7px; background:var(--meterBg); border-radius:4px; overflow:hidden; position:relative; display:flex; justify-content:flex-end; margin-left:10px; max-width:70%; min-width:16px; }
.time-row .meterFill{ height:100%; border-radius:4px; width:0%; background:var(--accent); }
.time-row.fard .name{ color:var(--fard); }
.time-row.nafil .name{ color:var(--nafil); }
.time-row.special .name{ color:var(--special); }
.time-row.meal .name{ color:var(--meal); }
.time-row.current{ background:var(--card2); box-shadow:0 0 0 1.5px var(--accent) inset, 0 2px 10px rgba(0,0,0,0.10); padding-top:8px; padding-bottom:8px; min-height:56px; }
.time-row.current .name{ font-weight:800; font-size:15.5px; }
.time-row.current .pIcon{ font-size:19px; }
.time-row.past{ opacity:0.4; }
.time-row.past .name{ color:var(--sub) !important; font-weight:500; }
.time-row.past .clock{ color:var(--sub); }
.time-row.future{ opacity:0.62; }
.time-row.future .name{ font-weight:500; }
.time-row.status-green{ background:color-mix(in srgb, var(--green) 16%, transparent); }
.time-row.status-yellow{ background:color-mix(in srgb, var(--yellow) 18%, transparent); }
.time-row.status-red{ background:color-mix(in srgb, var(--red) 16%, transparent); }
.time-row.status-green.past{ opacity:0.6; }
.time-row.status-yellow.past{ opacity:0.6; }
.time-row.status-red.past{ opacity:0.6; }
#timesList.namaz-mode{ justify-content:flex-start; gap:12px; padding-top:8px; }
#timesList.namaz-mode .time-row{
  background:var(--card); box-shadow:0 0 0 1px var(--line) inset;
  padding:11px 10px; border-radius:12px; min-height:52px;
}
#timesList.namaz-mode .time-row .name{ font-size:13.5px; font-weight:700; flex-basis:116px; }
#timesList.namaz-mode .pIcon{ font-size:17px; }
#timesList.namaz-mode .time-row .clock{ font-size:12px; }
#timesList.namaz-mode .time-row.current{ background:var(--card2); box-shadow:0 0 0 2px var(--accent) inset, 0 3px 14px rgba(0,0,0,0.14); padding:14px 10px; min-height:74px; }
#timesList.namaz-mode .time-row.current .name{ font-size:15px; font-weight:800; }
#timesList.namaz-mode .time-row.current .pIcon{ font-size:20px; }
#timesList.namaz-mode .time-row.future{ opacity:0.6; box-shadow:none; }
#timesList.namaz-mode .time-row.past{ box-shadow:none; }
#timesList.namaz-mode .dot-btn{ width:19px; height:19px; }
#timesList.namaz-mode .dotsSlot{ flex-basis:63px; }
#timesList.namaz-mode .meterWrap{ height:8px; min-width:20px; margin-left:6px; }
#timesList.namaz-mode .remainText{ font-size:13.5px; }
.dotsSlot{ flex:0 0 76px; display:flex; align-items:center; justify-content:flex-end; }
.status-dots{ flex:0 0 auto; display:flex; gap:3px; margin-left:auto; }
.dot-btn{
  width:23px; height:23px; border-radius:50%; border:1.5px solid var(--dotBorder, var(--line)); background:transparent; cursor:pointer; padding:0;
}
.dot-btn.on-green{ background:var(--green); border-color:var(--green); }
.dot-btn.on-yellow{ background:var(--yellow); border-color:var(--yellow); }
.dot-btn.on-red{ background:var(--red); border-color:var(--red); }

/* ---------- TAB BAR ---------- */
#tabbar{
  flex:0 0 auto; display:flex; background:var(--tabbar); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:13px 0 11px; background:none; border:none; color:var(--sub); cursor:pointer;
}
.tab-btn.active{ color:var(--accent); }
.tab-btn .ic{ font-size:27px; line-height:1; }
.tab-btn .lb{ font-size:13.5px; font-weight:600; }

/* ---------- generic screen padding ---------- */
.pad{ padding:14px; }
.section-title{ font-size:15px; font-weight:700; margin:16px 0 8px; color:var(--text); }
.section-title:first-child{ margin-top:2px; }

/* ---------- CALENDAR TAB ---------- */
.cal-header{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line);}
.cal-header button{ background:var(--card); border:1px solid var(--line); color:var(--text); width:32px; height:32px; border-radius:8px; font-size:16px; }
.cal-header .month-label{ font-weight:700; font-size:15px; text-align:center; }
.cal-header .month-label .sub{ display:block; font-size:11px; color:var(--sub); font-weight:500; }
.cal-toggle{ display:flex; justify-content:center; gap:6px; padding:8px 14px 0; }
.cal-toggle button{ flex:1; padding:6px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--sub); font-size:12px; font-weight:600; }
.cal-toggle button.active{ background:var(--accent); color:#08131c; border-color:var(--accent); }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:10px 14px; }
.cal-dow{ text-align:center; font-size:10px; color:var(--sub); font-weight:700; }
.cal-cell{
  aspect-ratio:1; border-radius:8px; background:var(--card); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:12px; cursor:pointer; position:relative;
}
.cal-cell.today{ border-color:var(--accent); }
.cal-cell.empty{ background:none; border:none; }
.cal-cell.roza{ background:color-mix(in srgb, var(--roza) 16%, var(--card)); border-color:color-mix(in srgb, var(--roza) 45%, var(--line)); }
.cal-roza-mark{ position:absolute; top:2px; right:3px; font-size:8px; line-height:1; }
.cal-dots{ display:flex; gap:2px; }
.cal-dots span{ width:5px; height:5px; border-radius:50%; background:var(--line); }
.cal-detail{ margin:10px 14px 20px; padding:12px; background:var(--card); border-radius:12px; border:1px solid var(--line); }
.cal-detail .row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
.cal-detail .row:last-child{ border-bottom:none; }
.cal-detail .tag{ padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; }

/* ---------- RAMZAN TAB ---------- */
.ramzan-card{ margin:0 14px 14px; padding:14px; background:var(--card); border-radius:14px; border:1px solid var(--line); }
.ramzan-card h3{ font-size:14px; margin-bottom:10px; }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{ padding:8px 12px; border-radius:20px; border:1px solid var(--line); background:var(--card2); font-size:12.5px; font-weight:600; color:var(--sub); cursor:pointer; }
.chip.prayed{ background:var(--green); color:#06210f; border-color:var(--green); }
.chip.qaza{ background:var(--yellow); color:#2b2100; border-color:var(--yellow); }
.chip.pending{ background:var(--red); color:#2b0808; border-color:var(--red); }
.roza-toggle{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; }
.switch{ width:46px; height:26px; border-radius:14px; background:var(--meterBg); position:relative; cursor:pointer; border:1px solid var(--line); }
.switch.on{ background:var(--roza); }
.switch .knob{ width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left .15s; }
.switch.on .knob{ left:22px; }

/* ---------- MORE TAB ---------- */
.more-list{ padding:6px 14px 20px; }
.more-item{ display:flex; align-items:center; gap:12px; padding:14px 6px; border-bottom:1px solid var(--line); cursor:pointer; }
.more-item .ic{ font-size:20px; width:26px; text-align:center; }
.more-item .lbl{ font-size:14.5px; font-weight:600; flex:1; }
.more-item .chev{ color:var(--sub); }
.theme-row{ display:flex; gap:8px; padding:0 6px 16px; }
.theme-row button{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:12.5px; font-weight:600; }
.theme-row button.active{ background:var(--accent); color:#08131c; border-color:var(--accent); }

.search-bar{ margin:10px 14px; }
.search-bar input{
  width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--text); font-size:13.5px;
}
.view-toggle{ display:flex; gap:6px; margin:0 14px 10px; }
.view-toggle button{ padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--sub); font-size:12px; }
.view-toggle button.active{ background:var(--accent); color:#08131c; border-color:var(--accent); }

.dua-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px 20px; }
.dua-grid.list{ grid-template-columns:1fr; }
.dua-card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; }
.dua-card .cat{ font-size:10.5px; color:var(--accent); font-weight:700; text-transform:uppercase; margin-bottom:4px; }
.dua-card .title{ font-size:13.5px; font-weight:700; margin-bottom:4px; }
.dua-card .prev{ font-size:11.5px; color:var(--sub); line-height:1.4; }

.hadees-cat{ padding:0 14px 6px; }
.hadees-cat .chip-row{ margin-bottom:10px; }
.hadees-item{ margin:0 14px 10px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; }
.hadees-item .src{ font-size:11px; color:var(--accent); font-weight:700; margin-bottom:6px; }
.hadees-item .txt{ font-size:13px; line-height:1.5; }

/* quiz */
.quiz-progress{ height:6px; background:var(--meterBg); border-radius:4px; overflow:hidden; margin:0 0 20px; }
.quiz-progress-fill{ height:100%; background:var(--accent); border-radius:4px; transition:width .2s; }
.quiz-q{ font-size:15.5px; font-weight:700; line-height:1.5; margin-bottom:18px; }
.quiz-opts{ display:flex; flex-direction:column; gap:10px; }
.quiz-opt{
  text-align:left; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--card); color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer;
}
.quiz-opt.correct{ background:color-mix(in srgb, var(--green) 22%, var(--card)); border-color:var(--green); color:var(--green); }
.quiz-opt.wrong{ background:color-mix(in srgb, var(--red) 22%, var(--card)); border-color:var(--red); color:var(--red); }
.quiz-reveal{ margin-top:12px; padding:10px 12px; border-radius:10px; background:color-mix(in srgb, var(--green) 14%, var(--card)); border:1px solid var(--green); font-size:13px; color:var(--text); }
.quiz-count-btn{
  padding:14px 22px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  color:var(--text); font-size:14px; font-weight:700; cursor:pointer;
}
.quiz-cat-btn{
  display:flex; align-items:center; gap:10px; width:calc(100% - 28px); margin:0 14px 10px;
  padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  color:var(--text); cursor:pointer; text-align:left;
}
.quiz-cat-ic{ font-size:20px; }
.quiz-cat-name{ flex:1; font-size:13.5px; font-weight:700; }
.quiz-cat-count{ font-size:11px; color:var(--sub); font-weight:600; }

/* detail overlay */
#detailOverlay{
  position:absolute; inset:0; background:var(--bg); z-index:50; display:none;
  flex-direction:column;
}
#detailOverlay.active{ display:flex; }
.detail-header{ display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line); }
.detail-header button{ background:var(--card); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:8px; font-size:16px; }
.detail-header .t{ font-weight:700; font-size:15px; }
.detail-body{ flex:1; overflow-y:auto; padding:20px; }
.detail-body .arabic{ font-size:22px; text-align:right; line-height:2; margin-bottom:16px; direction:rtl; color:var(--text); }
.detail-body .translit{ font-size:13.5px; color:var(--sub); font-style:italic; margin-bottom:10px; line-height:1.6; }
.detail-body .meaning{ font-size:14px; line-height:1.6; }
.detail-body .ref{ margin-top:16px; font-size:12px; color:var(--accent); }

/* info modal */
#infoModal{
  position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200;
  display:none; align-items:center; justify-content:center; padding:24px;
}

<script>
/* ============================================================

const TZ = 5.5; // India Standard Time
const PRIORITY_CITIES = [

].sort((a,b)=>a.name.localeCompare(b.name));

const CITIES = [...PRIORITY_CITIES, ...OTHER_CITIES];
const FAJR_ANGLE = 18, ISHA_ANGLE = 17; // MWL (Muslim World League) - common for India

function julianDate(y,m,d){
  if(m<=2){ y-=1; m+=12; }
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPosition(jd){
  const D = jd - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028*D);
  const q = fixAngle(280.459 + 0.98564736*D);
  const L = fixAngle(q + 1.915*dsin(g) + 0.020*dsin(2*g));
  const e = 23.439 - 0.00000036*D;
  const dec = darcsin(dsin(e)*dsin(L));
  let RA = darctan2(dcos(e)*dsin(L), dcos(L))/15;
  RA = fixHour(RA);
  const eqt = q/15 - RA;
  return {declination:dec, eqt:eqt};
}
function fixAngle(a){ a=a-360*Math.floor(a/360); return a<0?a+360:a; }
function fixHour(a){ a=a-24*Math.floor(a/24); return a<0?a+24:a; }
function dsin(d){return Math.sin(d*Math.PI/180);}
function dcos(d){return Math.cos(d*Math.PI/180);}
function dtan(d){return Math.tan(d*Math.PI/180);}
function darcsin(x){return Math.asin(x)*180/Math.PI;}
function darccos(x){return Math.acos(x)*180/Math.PI;}
function darctan2(y,x){return Math.atan2(y,x)*180/Math.PI;}

function computeTime(jd, angleOrMin, isAngle, isAfter, lat, lon, tz){
  const sp = sunPosition(jd + (isAfter? 0.5 : -0.5 + 0.5)); // approximation, refined below with iteration
  return sp;
}

function sunAngleTime(jd, angle, lat, direction){
  const sp = sunPosition(jd);
  const dec = sp.declination;
  const num = -dsin(angle) - dsin(dec)*dsin(lat);
  const den = dcos(dec)*dcos(lat);
  let ratio = num/den;
  ratio = Math.max(-1, Math.min(1, ratio));
  const t = darccos(ratio)/15;
  return direction==='ccw' ? -t : t;
}

function computeDayTimes(date, lat, lon, tz){
  const jd = julianDate(date.getFullYear(), date.getMonth()+1, date.getDate()) - lon/(15*24);
  const noonBase = 12 - lon/15 + tz - 0; // approx

  function timeFor(angle, isMorning){
    let T = 12; // start guess (hours, local solar-ish)
    for(let i=0;i<2;i++){
      const jdT = jd + T/24;
      const sp = sunPosition(jdT);
      const dec = sp.declination, eqt = sp.eqt;
      const noon = fixHour(12 - eqt);
      const num = -dsin(angle) - dsin(dec)*dsin(lat);
      const den = dcos(dec)*dcos(lat);
      let ratio = Math.max(-1, Math.min(1, num/den));
      const H = darccos(ratio)/15;
      T = isMorning ? noon - H : noon + H;
    }
    return fixHour(T + tz - lon/15);
  }
  function solarNoon(){
    let T=12;
    const jdT = jd + T/24;
    const sp = sunPosition(jdT);
    const noon = fixHour(12 - sp.eqt);
    return fixHour(noon + tz - lon/15);
  }
  function darccot(x){ return darctan2(1,x); }
  function asrTime(shadowFactor){
    let T = 13;
    for(let i=0;i<2;i++){
      const jdT = jd + T/24;
      const sp = sunPosition(jdT);
      const dec = sp.declination, eqt = sp.eqt;
      const noon = fixHour(12 - eqt);
      const angle = -darccot(shadowFactor + dtan(Math.abs(lat-dec)));
      const num = -dsin(angle) - dsin(dec)*dsin(lat);
      const den = dcos(dec)*dcos(lat);
      const ratio = Math.max(-1, Math.min(1, num/den));
      const H = darccos(ratio)/15;
      T = noon + H;
    }
    return fixHour(T + tz - lon/15);
  }

  const fajr = timeFor(FAJR_ANGLE, true);
  const sunrise = timeFor(0.833, true);
  const dhuhr = fixHour(solarNoon() + (1/60)); // +1 min safety after zawal
  const zawalEnd = solarNoon(); // moment of zawal (istawa) - zuhr starts right after
  const asr = asrTime(2); // Hanafi factor 2 (standard for India)
  const maghrib = timeFor(0.833, false);
  const isha = timeFor(ISHA_ANGLE, false);

  return { fajr, sunrise, dhuhr, zawal: zawalEnd, asr, maghrib, isha, jd };
}

function toDate(baseDate, hourFloat){
  const d = new Date(baseDate);
  d.setHours(0,0,0,0);
  const h = Math.floor(hourFloat);
  const m = Math.round((hourFloat-h)*60);
  d.setHours(h, m, 0, 0);
  return d;
}
function fmtTime(d){
  const m = String(d.getMinutes()).padStart(2,'0');
  if(state.timeFormat==='12'){
    let h = d.getHours();
    const ap = h>=12?'PM':'AM';
    h = h%12; if(h===0) h=12;
    return h + ':' + m + ' ' + ap;
  }
  return String(d.getHours()).padStart(2,'0') + ':' + m;
}
function fmtTimeCompact(d){
  const m = String(d.getMinutes()).padStart(2,'0');
  if(state.timeFormat==='12'){
    let h = d.getHours();
    const ap = h>=12?'PM':'AM';
    h = h%12; if(h===0) h=12;
    return h + ':' + m + ' ' + ap;
  }
  return String(d.getHours()).padStart(2,'0') + ':' + m;
}
function fmtRange(p){
  if(p.key==='sehri') return 'Khatm ' + fmtTimeCompact(p.end);
  if(p.key==='iftar') return 'Shuru ' + fmtTimeCompact(p.start);
  return fmtTimeCompact(p.start) + '<span class="arrow">–</span>' + fmtTimeCompact(p.end);
}
function addMin(d, mins){ return new Date(d.getTime() + mins*60000); }
function fmtRemain(ms){
  const totalMin = Math.max(0, Math.ceil(ms/60000));
  if(totalMin >= 60){
    const h = Math.floor(totalMin/60), m = totalMin%60;
    return h+' Ghante'+(m>0 ? ' '+m+' Minute' : '');
  }
  return totalMin+' Minute'+(totalMin===1?'':'s');
}

/* Build full schedule for a given date */
function buildSchedule(date){
  const loc = (typeof state!=='undefined' && state.location) ? state.location : CITIES[0];
  const t = computeDayTimes(date, loc.lat, loc.lon, TZ);
  const fajr = toDate(date, t.fajr);
  const sunrise = toDate(date, t.sunrise);
  const zawal = toDate(date, t.zawal);
  const dhuhr = addMin(zawal, 3); // zuhr begins shortly after zawal ends
  const asr = toDate(date, t.asr);
  const maghrib = toDate(date, t.maghrib);
  const isha = toDate(date, t.isha);

  const sehriEnd = addMin(fajr, -1); // sehri ends 1 min before fajr
  const sehriStart = addMin(fajr, -90);
  const ishraq = addMin(sunrise, 20);
  const chaast = addMin(sunrise, 90);
  const zawalStart = addMin(zawal, -15); // makrooh window before zawal
  const iftar = new Date(maghrib);
  const awwabin = addMin(maghrib, 20);
  const nightLen = (fajr.getTime()+24*3600000 - maghrib.getTime());
  const tahajjudStart = new Date(maghrib.getTime() + nightLen*0.5); // half the night
  const tihaiStart = new Date(maghrib.getTime() + nightLen*(2/3)); // last third of the night
  const ishaEnd = addMin(fajr,-1);

  return [
    {key:'sehri', name:'Sehri', type:'meal', start:sehriStart, end:sehriEnd},
    {key:'fajr', name:'Fajr', type:'fard', start:fajr, end:sunrise},
    {key:'tulu', name:'Tulu Aftab', type:'special', start:sunrise, end:ishraq},
    {key:'ishraq', name:'Ishraq', type:'nafil', start:ishraq, end:chaast},
    {key:'chaast', name:'Chaast', type:'nafil', start:chaast, end:zawalStart},
    {key:'zawal', name:'Zawal', type:'special', start:zawalStart, end:dhuhr},
    {key:'zuhr', name:'Zuhr', type:'fard', start:dhuhr, end:asr},
    {key:'asr', name:'Asr', type:'fard', start:asr, end:maghrib},
    {key:'ghurub', name:'Ghurub Aftab', type:'special', start:addMin(maghrib,-20), end:maghrib},
    {key:'iftar', name:'Iftar', type:'meal', start:maghrib, end:addMin(maghrib,10)},
    {key:'maghrib', name:'Maghrib', type:'fard', start:maghrib, end:isha},
    {key:'awwabin', name:'Awwabin', type:'nafil', start:awwabin, end:isha},
    {key:'isha', name:'Isha', type:'fard', start:isha, end:addMin(fajr,24*60-1)},
    {key:'tahajjud', name:'Tahajjud', type:'nafil', start:tahajjudStart, end:addMin(fajr,24*60)},
    {key:'tihai', name:"Du'a Qubooliyat", type:'special', start:tihaiStart, end:addMin(fajr,24*60)},
  ];
}

/* icon + ambient-theme-category per prayer key */
const PRAYER_META = {

const INFO_TEXT = {

  const meta = PRAYER_META[key];

/* ============================================================
   HIJRI DATE (arithmetic / tabular Islamic calendar approximation)
   ============================================================ */
const HIJRI_MONTHS = ["Muharram","Safar","Rabi-ul-Awwal","Rabi-ul-Aakhir","Jamadi-ul-Awwal","Jamadi-ul-Aakhir","Rajab","Sha'ban","Ramzan","Shawwal","Zul-Qa'dah","Zul-Hijjah"];
function gregorianToHijri(date){
  const jd = Math.floor(julianDate(date.getFullYear(), date.getMonth()+1, date.getDate())) + 1;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  return { day, month, year, monthName: HIJRI_MONTHS[month-1] };
}
function hijriOffset(){
  try{ return parseInt(localStorage.getItem('hijriOffset')||'0'); }catch(e){ return 0; }
}

const FIVE = ['fajr','zuhr','asr','maghrib','isha'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let homeViewDate = new Date();
let lastLiveKey = null;
function isSameDay(a,b){ return dayKey(a)===dayKey(b); }

function renderHome(){
  const now = new Date();
  const viewDate = homeViewDate;
  const isToday = isSameDay(viewDate, now);
  const isPastDate = !isToday && viewDate < now;
  const isFutureDate = !isToday && !isPastDate;
  document.getElementById('bulkBtns').classList.toggle('disabled', isFutureDate);

  document.getElementById('gregDate').innerHTML = DOW[viewDate.getDay()]+', '+viewDate.getDate()+' '+MON[viewDate.getMonth()]+' '+viewDate.getFullYear() + (isToday ? '<span class="todayTag">Aaj</span>' : '');
  const hd = gregorianToHijri(viewDate);
  document.getElementById('hijriDate').textContent = hd.day+' '+hd.monthName+' '+hd.year+' AH';
  document.getElementById('cityLabel').textContent = '📍 ' + state.location.name + (state.location.state ? ', '+state.location.state : '');
  document.getElementById('namazModeBtn').classList.toggle('on', state.namazMode);

  const sched = buildSchedule(viewDate);
  const listEl = document.getElementById('timesList');
  listEl.innerHTML = '';
  listEl.classList.toggle('namaz-mode', state.namazMode);

  let currentIdx = -1;
  if(isToday){
    for(let i=0;i<sched.length;i++){
      if(sched[i].key==='iftar' || sched[i].key==='ghurub') continue; // overlap with Maghrib/Asr; handled separately below
      if(now >= sched[i].start && now < sched[i].end){ currentIdx = i; break; }
    }
  }
  const maghribRow = sched.find(x=>x.key==='maghrib');
  const ishaRow = sched.find(x=>x.key==='isha');
  const fajrRow = sched.find(x=>x.key==='fajr');
  const ghurubRow = sched.find(x=>x.key==='ghurub');
  const isIftarActive = isToday && now>=maghribRow.start && now<ishaRow.start;
  const isAsrWarning = isToday && now>=ghurubRow.start && now<maghribRow.start;
  const isGhurubActive = isAsrWarning;

  const displaySched = state.namazMode ? sched.filter(p=>FIVE.includes(p.key)) : sched;
  displaySched.forEach((p)=>{
    const idx = sched.indexOf(p);
    const row = document.createElement('div');
    let isPast, isFuture, isLive = false;
    if(p.key==='iftar'){
      isLive = isIftarActive;
      isPast = isToday ? now>=ishaRow.start : isPastDate;
      isFuture = isToday ? now<maghribRow.start : !isPastDate;
    } else if(p.key==='ghurub'){
      isLive = isGhurubActive;
      isPast = isToday ? now>=maghribRow.start : isPastDate;
      isFuture = isToday ? now<ghurubRow.start : !isPastDate;
    } else if(isToday){
      isPast = idx!==currentIdx && now>=p.end;
      isFuture = idx!==currentIdx && now<p.start;
      isLive = idx===currentIdx;
    } else {
      isPast = isPastDate;
      isFuture = !isPastDate;
    }
    const stateClass = isLive ? 'current' : isPast ? 'past' : 'future';
    const rowStatus = FIVE.includes(p.key) ? getStatus(viewDate, p.key) : undefined;
    const statusClass = rowStatus ? ' status-'+rowStatus : '';
    row.className = 'time-row '+p.type+' '+stateClass+statusClass;
    row.dataset.key = p.key;

    let dotsHtml = '';
    let sehriHtml = '';
    if(FIVE.includes(p.key) && !isFuture){
      const st = rowStatus;
      dotsHtml = `<div class="status-dots">
        <button class="dot-btn ${st==='green'?'on-green':''}" data-prayer="${p.key}" data-set="green" title="Padh Li"></button>
        <button class="dot-btn ${st==='yellow'?'on-yellow':''}" data-prayer="${p.key}" data-set="yellow" title="Qaza Padhi"></button>
        <button class="dot-btn ${st==='red'?'on-red':''}" data-prayer="${p.key}" data-set="red" title="Baaki Hai"></button>
      </div>`;
    } else if(p.key==='sehri' && !isFutureDate){
      const rozaOn = !!state.roza[dayKey(viewDate)];
      sehriHtml = `<div style="display:flex; align-items:center; gap:5px;">
        <span style="font-size:10px; color:var(--sub); font-weight:600;">Roza</span>
        <div class="roza-mini ${rozaOn?'on':''}" id="rozaMiniBtn"><div class="roza-mini-knob"></div></div>
      </div>`;
    }

    const icon = (PRAYER_META[p.key] && PRAYER_META[p.key].icon) || '🕐';
    let meterColor = p.type==='fard'?'var(--fard)':p.type==='nafil'?'var(--nafil)':p.type==='meal'?'var(--meal)':'var(--special)';
    if(p.key==='asr' && isAsrWarning) meterColor = 'var(--red)';

    let meterHtml = '';
    let remainHtml = '';
    if(p.key==='iftar'){
      if(isLive) meterHtml = `<div class="meterWrap"><div class="meterFill" style="width:100%; background:${meterColor}"></div></div>`;
    } else if(p.key==='sehri' && isLive){
      const effStart = new Date(fajrRow.start.getTime() - 60*60000);
      if(now >= effStart){
        const pct = Math.min(100, Math.max(0, (now-effStart)/(fajrRow.start-effStart)*100));
        meterHtml = `<div class="meterWrap"><div class="meterFill" style="width:${100-pct}%; background:${meterColor}"></div></div>`;
        remainHtml = `<div class="remainText"><span class="remainLabel">Waqt Baki:</span> <span class="remainValue">${fmtRemain(fajrRow.start-now)}</span></div>`;
      }
    } else if(isLive){
      const pct = Math.min(100, Math.max(0, (now-p.start)/(p.end-p.start)*100));
      meterHtml = `<div class="meterWrap"><div class="meterFill" style="width:${100-pct}%; background:${meterColor}"></div></div>`;
      remainHtml = `<div class="remainText"><span class="remainLabel">Waqt Baki:</span> <span class="remainValue">${fmtRemain(p.end-now)}</span></div>`;
    }

    let dotsSlot = '';
    if(dotsHtml){
      dotsSlot = `<div class="dotsSlot">${dotsHtml}</div>`;
    } else if(p.key==='sehri'){
      dotsSlot = sehriHtml;
    } else if(meterHtml){
      dotsSlot = `<div class="dotsSlot dotsSlotEmpty"></div>`;
    }

    row.innerHTML = `
      <div class="rowMain">
        <div class="name"><span class="pIcon">${icon}</span><span class="nameTxt">${p.name}</span></div>
        <div class="clock">${fmtRange(p)}</div>
        ${meterHtml}
        ${dotsSlot}
      </div>
      ${remainHtml || '<div class="remainText remainPlaceholder">&nbsp;</div>'}
    `;
    if(!meterHtml) row.querySelector('.clock').insertAdjacentHTML('afterend', '<div style="flex:1;"></div>');
    row.querySelector('.name').onclick = ()=> showInfoModal(p.key);
    listEl.appendChild(row);
  });

  if(isToday){
    const liveKey = (isIftarActive && 'iftar') || (isGhurubActive && 'ghurub') || (currentIdx>=0 && sched[currentIdx].key) || null;
    if(liveKey && liveKey !== lastLiveKey){
      const liveRow = listEl.querySelector('.time-row[data-key="'+liveKey+'"]');
      if(liveRow){
        const listTop = listEl.getBoundingClientRect().top;
        const rowTop = liveRow.getBoundingClientRect().top;
        const targetOffset = listEl.clientHeight * 0.22;
        listEl.scrollTo({ top: listEl.scrollTop + (rowTop - listTop) - targetOffset, behavior: 'smooth' });
      }
    }
    lastLiveKey = liveKey;
  }

  listEl.querySelectorAll('.dot-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const prayer = btn.dataset.prayer, want = btn.dataset.set;
      const cur = getStatus(viewDate, prayer);
      const k = statusKey(viewDate, prayer);
      if(cur===want){ delete state.status[k]; } else { state.status[k]=want; }
      saveState();
      renderHome();
    };
  });

  const rozaBtn = document.getElementById('rozaMiniBtn');
  if(rozaBtn){
    rozaBtn.onclick = ()=>{
      const rk = dayKey(viewDate);
      state.roza[rk] = !state.roza[rk];
      saveState();
      renderHome();
    };
  }
  const homeEl = document.getElementById('tab-home');
  const rozaActive = !!state.roza[dayKey(viewDate)];
  homeEl.style.background = rozaActive ? 'color-mix(in srgb, var(--roza) 9%, var(--bg))' : '';
}

let calMode = 'greg'; // greg | hijri
let calViewDate = new Date();

document.getElementById('calGregBtn').onclick=()=>{ calMode='greg'; document.getElementById('calGregBtn').classList.add('active'); document.getElementById('calHijriBtn').classList.remove('active'); renderCalendar(); };

function shiftCalMonth(dir){
  if(calMode==='greg'){
    calViewDate = new Date(calViewDate.getFullYear(), calViewDate.getMonth()+dir, 1);
  } else {
    calViewDate = new Date(calViewDate.getTime() + dir*29.5*24*3600000);
  }
  renderCalendar();
}

function renderCalendar(){
  const dowEl = document.getElementById('calDow');
  dowEl.innerHTML = ['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  document.getElementById('calDetail').style.display='none';
  calDetailDate = null;

  if(calMode==='greg'){
    const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
    document.getElementById('calMonthLabel').innerHTML = MON[m]+' '+y+'<span class="sub">Gregorian</span>';
    const first = new Date(y,m,1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();
    for(let i=0;i<startDow;i++){ grid.appendChild(emptyCell()); }
    for(let d=1; d<=daysInMonth; d++){
      const date = new Date(y,m,d);
      grid.appendChild(dayCell(date));
    }
  } else {
    const hd = gregorianToHijri(calViewDate);
    document.getElementById('calMonthLabel').innerHTML = hd.monthName+' '+hd.year+'<span class="sub">Hijri</span>';
    // find first gregorian date corresponding to day 1 of this hijri month
    let probe = new Date(calViewDate);
    let cur = gregorianToHijri(probe);
    while(cur.day !== 1 || cur.month !== hd.month){
      probe = new Date(probe.getTime() - 24*3600000);
      cur = gregorianToHijri(probe);
      if (cur.month === hd.month && cur.day===1) break;
    }
    const monthStart = new Date(probe);
    const startDow = monthStart.getDay();
    for(let i=0;i<startDow;i++){ grid.appendChild(emptyCell()); }
    let d = new Date(monthStart);
    let count = 0;
    while(true){
      const h = gregorianToHijri(d);
      if(h.month !== hd.month || count>35) break;
      grid.appendChild(dayCell(new Date(d)));
      d = new Date(d.getTime()+24*3600000);
      count++;
    }
  }

  const todayCell = grid.querySelector('.cal-cell.today');
  if(todayCell) showDayDetail(new Date());
}
function emptyCell(){ const c=document.createElement('div'); c.className='cal-cell empty'; return c; }
function dayCell(date){
  const c = document.createElement('div');
  const isToday = dayKey(date)===dayKey(new Date());
  const rozaOn = !!state.roza[dayKey(date)];
  c.className = 'cal-cell'+(isToday?' today':'')+(rozaOn?' roza':'');
  const label = calMode==='greg' ? date.getDate() : gregorianToHijri(date).day;
  let dotsHtml = '<div class="cal-dots">';
  FIVE.forEach(p=>{
    const st = getStatus(date, p);
    const color = st==='green'?'var(--green)':st==='yellow'?'var(--yellow)':st==='red'?'var(--red)':'var(--line)';
    dotsHtml += `<span style="background:${color}"></span>`;
  });
  dotsHtml += '</div>';
  const rozaMark = rozaOn ? '<span class="cal-roza-mark">☪️</span>' : '';
  c.innerHTML = `${rozaMark}<div>${label}</div>${dotsHtml}`;
  c.onclick = ()=> showDayDetail(date);
  return c;
}
let calDetailDate = null;
function showDayDetail(date){
  calDetailDate = date;
  const det = document.getElementById('calDetail');
  det.style.display='block';
  const hd = gregorianToHijri(date);
  const icon = (k)=> (PRAYER_META[k] && PRAYER_META[k].icon) || '🕐';
  let html = `<div style="font-weight:700; margin-bottom:8px; font-size:13.5px;">
    ${DOW[date.getDay()]}, ${date.getDate()} ${MON[date.getMonth()]} ${date.getFullYear()} &nbsp;•&nbsp; ${hd.day} ${hd.monthName} ${hd.year} AH
  </div>`;
  FIVE.forEach(p=>{
    const st = getStatus(date,p);
    html += `<div class="row">
      <span style="text-transform:capitalize">${icon(p)} ${p}</span>
      <div class="status-dots">
        <button class="dot-btn ${st==='green'?'on-green':''}" data-prayer="${p}" data-set="green" title="Padh Li"></button>
        <button class="dot-btn ${st==='yellow'?'on-yellow':''}" data-prayer="${p}" data-set="yellow" title="Qaza Padhi"></button>
        <button class="dot-btn ${st==='red'?'on-red':''}" data-prayer="${p}" data-set="red" title="Baaki Hai"></button>
      </div>
    </div>`;
  });
  det.innerHTML = html;
  det.querySelectorAll('.dot-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const prayer = btn.dataset.prayer, want = btn.dataset.set;
      const cur = getStatus(calDetailDate, prayer);
      const k = statusKey(calDetailDate, prayer);
      if(cur===want){ delete state.status[k]; } else { state.status[k]=want; }
      saveState();
      renderCalendar();
      showDayDetail(calDetailDate);
    };
  });
}

  const tk = 'tarabih_'+k;

  const ishaRowR = sched.find(x=>x.key==='isha');
  const tarabihStarted = ishaRowR && now >= ishaRowR.start;
  const tDotsHtml = tarabihStarted ? `<div class="status-dots">
      <button class="dot-btn ${tSt==='prayed'?'on-green':''}" data-t="prayed" title="Padhi Gayi"></button>
      <button class="dot-btn ${tSt==='qaza'?'on-yellow':''}" data-t="qaza" title="Qaza"></button>

  const tRow = document.createElement('div');

  tRow.innerHTML = `<span style="font-weight:700; font-size:13.5px;">📿 Taraabih</span>${tDotsHtml}`;
  listEl.appendChild(tRow);

  listEl.querySelectorAll('.dot-btn').forEach(btn=>{
    if(btn.dataset.p){
      btn.onclick=()=>{
        const p=btn.dataset.p, want=btn.dataset.s;
        const kk = statusKey(now,p);
        if(state.status[kk]===want) delete state.status[kk]; else state.status[kk]=want;
        saveState(); renderRamzan();
      };
    } else if(btn.dataset.t){
      btn.onclick=()=>{
        const want=btn.dataset.t;
        state.tarabih[tk] = state.tarabih[tk]===want ? undefined : want;
        saveState(); renderRamzan();
      };
    }
  });
}

let duaView='grid', duaSearch='';
let hadeesFilter='All', hadeesSearch='';

function renderMoreDua(){
  document.getElementById('detailTitle').textContent="Du'a";
  const body = document.getElementById('detailBody');
  body.innerHTML = `
    <div class="search-bar"><input id="duaSearchInput" placeholder="Dua dhoondhiye..." value="${duaSearch}"></div>
    <div class="view-toggle">
      <button id="duaGridBtn" class="${duaView==='grid'?'active':''}">Grid</button>
      <button id="duaListBtn" class="${duaView==='list'?'active':''}">List</button>
    </div>
    <div class="dua-grid ${duaView==='list'?'list':''}" id="duaGrid"></div>
  `;
  body.querySelector('#duaSearchInput').oninput = (e)=>{ duaSearch=e.target.value; renderMoreDua(); };
  body.querySelector('#duaGridBtn').onclick = ()=>{ duaView='grid'; renderMoreDua(); };
  body.querySelector('#duaListBtn').onclick = ()=>{ duaView='list'; renderMoreDua(); };
  const grid = body.querySelector('#duaGrid');
  const filtered = DUAS.filter(d=> (d.title+d.cat).toLowerCase().includes(duaSearch.toLowerCase()));
  filtered.forEach(d=>{
    const c = document.createElement('div');
    c.className='dua-card';
    c.innerHTML = `<div class="cat">${d.cat}</div><div class="title">${d.title}</div><div class="prev">${d.meaning.slice(0,60)}...</div>`;
    c.onclick = ()=> openDuaDetail(d);
    grid.appendChild(c);
  });
}
function openDuaDetail(d){
  document.getElementById('detailTitle').textContent = d.title;
  document.getElementById('detailBody').innerHTML = `
    <div class="arabic">${d.arabic}</div>
    <div class="translit">${d.translit}</div>
    <div class="meaning">${d.meaning}</div>
    <div class="ref">Hawala: ${d.ref}</div>
  `;
}
function renderMoreHadees(){
  document.getElementById('detailTitle').textContent="Hadees";
  const cats = ['All', ...new Set(HADEES.map(h=>h.cat))];
  const body = document.getElementById('detailBody');
  body.innerHTML = `
    <div class="search-bar"><input id="hSearchInput" placeholder="Hadees dhoondhiye..." value="${hadeesSearch}"></div>
    <div class="chip-row" style="padding:0 0 10px;" id="hCats"></div>
    <div id="hList"></div>
  `;
  body.querySelector('#hSearchInput').oninput=(e)=>{ hadeesSearch=e.target.value; renderMoreHadees(); };
  const catsEl = body.querySelector('#hCats');
  cats.forEach(c=>{
    const chip = document.createElement('div');
    chip.className='chip'+(hadeesFilter===c?' prayed':'');
    chip.textContent=c;
    chip.onclick=()=>{ hadeesFilter=c; renderMoreHadees(); };
    catsEl.appendChild(chip);
  });
  const list = body.querySelector('#hList');
  HADEES.filter(h=> (hadeesFilter==='All'||h.cat===hadeesFilter) && h.txt.toLowerCase().includes(hadeesSearch.toLowerCase()))
    .forEach(h=>{
      const it = document.createElement('div');
      it.className='hadees-item';
      it.style.margin='0 0 10px';
      it.innerHTML = `<div class="src">${h.cat} • ${h.src}</div><div class="txt">${h.txt}</div>`;
      list.appendChild(it);
    });
}

let quizState = null;

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

  "Namaz":"🕌", "Akhlaq aur Muashira":"🤝", "Quran aur Ibadaat":"📖",
  "Seerat-un-Nabi ﷺ":"🌙", "Ambiya-e-Kiram AS":"⭐", "Ahadees aur Sunnat":"📜",

    return `<button class="quiz-cat-btn" data-cat="${cat}">

      <span class="quiz-cat-count">${count} sawal</span>

  }).join('');
  body.innerHTML = `
    <div style="text-align:center; padding:16px 10px 6px;">

      <div style="font-size:15px; font-weight:700; margin-bottom:4px;">Islami Malumat Ka Quiz</div>

function renderQuizCountSelect(cat){
  const pool = cat==='__all__' ? QUIZ_BANK : QUIZ_BANK.filter(q=>q[3]===cat);
  document.getElementById('detailTitle').textContent = "Quiz";
  const body = document.getElementById('detailBody');
  const label = cat==='__all__' ? 'Sab Categories' : cat;
  body.innerHTML = `
    <div style="text-align:center; padding:30px 10px;">
      <div style="font-size:40px; margin-bottom:10px;">${cat==='__all__'?'🌐':(QUIZ_CAT_ICON[cat]||'❓')}</div>
      <div style="font-size:15px; font-weight:700; margin-bottom:6px;">${label}</div>
      <div style="font-size:13px; color:var(--sub); margin-bottom:24px;">Kitne sawal khelna chahte hain?</div>
      <div style="display:flex; gap:12px; justify-content:center;">
        <button id="quiz5" class="quiz-count-btn">5 Sawal</button>
        <button id="quiz10" class="quiz-count-btn">10 Sawal</button>
      </div>
      <button id="quizBackToCats" style="margin-top:22px; background:none; border:none; color:var(--sub); font-size:12.5px; text-decoration:underline; cursor:pointer;">‹ Category Badlein</button>
    </div>
  `;
  document.getElementById('quiz5').onclick = ()=> startQuiz(pool, Math.min(5, pool.length));
  document.getElementById('quiz10').onclick = ()=> startQuiz(pool, Math.min(10, pool.length));
  document.getElementById('quizBackToCats').onclick = renderMoreQuiz;
}

function startQuiz(pool, n){
  const picked = shuffleArr(pool).slice(0, n);
  quizState = { questions: picked, idx: 0, score: 0, answered: false };
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const qs = quizState;
  const [q, opts, correct] = qs.questions[qs.idx];
  document.getElementById('detailTitle').textContent = `Sawal ${qs.idx+1}/${qs.questions.length}`;
  const body = document.getElementById('detailBody');
  body.innerHTML = `
    <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${(qs.idx/qs.questions.length)*100}%"></div></div>
    <div class="quiz-q">${q}</div>
    <div class="quiz-opts" id="quizOpts">
      ${opts.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div id="quizRevealWrap"></div>
    <div id="quizNextWrap" style="margin-top:16px; text-align:center;"></div>
  `;
  body.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(qs.answered) return;
      qs.answered = true;
      const chosen = parseInt(btn.dataset.i);
      body.querySelectorAll('.quiz-opt').forEach(b=>{
        const bi = parseInt(b.dataset.i);
        if(bi===correct) b.classList.add('correct');
        else if(bi===chosen) b.classList.add('wrong');
      });
      if(chosen===correct){
        qs.score++;
      } else {
        document.getElementById('quizRevealWrap').innerHTML = `<div class="quiz-reveal">Sahi Jawab: <b>${opts[correct]}</b></div>`;
      }
      const isLast = qs.idx===qs.questions.length-1;
      document.getElementById('quizNextWrap').innerHTML = `<button id="quizNextBtn" style="padding:12px 28px; border-radius:12px; border:none; background:var(--accent); color:var(--fardText); font-size:14px; font-weight:700; cursor:pointer;">${isLast?'Result Dekhiye':'Agla Sawal'}</button>`;
      document.getElementById('quizNextBtn').onclick = ()=>{
        if(isLast){ renderQuizResult(); } else { qs.idx++; qs.answered=false; renderQuizQuestion(); }
      };
    };
  });
}

function renderQuizResult(){
  const qs = quizState;
  const pct = Math.round((qs.score/qs.questions.length)*100);
  const msg = pct>=80 ? 'Zabardast! Mashallah.' : pct>=50 ? 'Achha kiya, aur mehnat kijiye.' : 'Koi baat nahi, dobara koshish kijiye.';
  document.getElementById('detailTitle').textContent = "Result";
  document.getElementById('detailBody').innerHTML = `
    <div style="text-align:center; padding:30px 10px;">
      <div style="font-size:44px; margin-bottom:10px;">🏆</div>
      <div style="font-size:26px; font-weight:800; margin-bottom:4px;">${qs.score} / ${qs.questions.length}</div>
      <div style="font-size:13px; color:var(--sub); margin-bottom:6px;">${pct}% Sahi Jawab</div>
      <div style="font-size:13.5px; margin-bottom:24px;">${msg}</div>
      <button id="quizRetry" style="padding:12px 24px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13.5px; font-weight:700; cursor:pointer;">Dobara Khelein</button>
    </div>
  `;
  document.getElementById('quizRetry').onclick = renderMoreQuiz;
}

let citySearch = '';
function renderMoreSettings(){
  document.getElementById('detailTitle').textContent="Settings";
  const loc = state.location;
  const body = document.getElementById('detailBody');
  body.innerHTML = `
    <div class="section-title" style="margin-top:0;">Location</div>
    <div class="ramzan-card" style="margin:0 0 14px;">
      <div style="font-size:13.5px; font-weight:700; margin-bottom:2px;">📍 ${loc.name}</div>
      <div style="font-size:11.5px; color:var(--sub); margin-bottom:12px;">${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)} ${loc.source==='gps' ? '(GPS)' : ''}</div>
      <button id="gpsBtn" style="width:100%; padding:11px; border-radius:10px; border:1px solid var(--line); background:var(--accent); color:var(--fardText); font-size:13px; font-weight:700; cursor:pointer;">📡 GPS Se Location Lein</button>
      <div id="gpsStatus" style="font-size:11.5px; color:var(--sub); margin-top:8px;"></div>
    </div>
    <div class="section-title" style="margin-top:0;">Ya Shehar Chuniye</div>
    <div class="search-bar" style="margin:0 0 10px;"><input id="citySearchInput" placeholder="Shehar dhoondhiye..." value="${citySearch}"></div>
    <div id="cityList"></div>
    <div class="section-title">Calculation</div>
    <div style="font-size:13px; line-height:1.8; color:var(--sub); padding-bottom:10px;">
      Fajr Angle: 18 darja &nbsp;|&nbsp; Isha Angle: 17 darja<br>
      Asr Calculation: Hanafi (standard)<br><br>
      <span style="color:var(--text)">Note:</span> Shafi Asr aur alag Hijri offset ka option future update mein add kiya jayega.
    </div>
  `;
  const cityListEl = body.querySelector('#cityList');
  function renderCityRow(c){
    const isActive = loc.source!=='gps' && loc.name===c.name;
    const row = document.createElement('div');
    row.className = 'hadees-item';
    row.style.margin = '0 0 8px';
    row.style.cursor = 'pointer';
    row.style.display = 'flex';
    row.style.justifyContent = 'space-between';
    row.style.alignItems = 'center';
    if(isActive){ row.style.borderColor = 'var(--accent)'; }
    row.innerHTML = `<span style="font-size:13.5px; font-weight:600;">${c.name}${c.state ? `<span style="color:var(--sub); font-weight:500;"> - ${c.state}</span>` : ''}</span>${isActive ? '<span style="color:var(--accent); font-size:13px;">✓</span>' : ''}`;
    row.onclick = ()=>{
      state.location = {name:c.name, lat:c.lat, lon:c.lon, state:c.state, source:'manual'};
      saveState();
      renderHome(); renderCalendar();
      renderMoreSettings();
    };
    return row;
  }
  function renderCityList(){
    cityListEl.innerHTML = '';
    if(citySearch.trim()===''){
      PRIORITY_CITIES.forEach(c=> cityListEl.appendChild(renderCityRow(c)));
      const divider = document.createElement('div');
      divider.textContent = 'Baaki Shehar';
      divider.style.cssText = 'font-size:11px; font-weight:700; color:var(--sub); margin:10px 0 8px; text-transform:uppercase; letter-spacing:0.3px;';
      cityListEl.appendChild(divider);
      OTHER_CITIES.forEach(c=> cityListEl.appendChild(renderCityRow(c)));
    } else {
      CITIES.filter(c=>c.name.toLowerCase().includes(citySearch.toLowerCase())).forEach(c=>{
        cityListEl.appendChild(renderCityRow(c));
      });
    }
  }
  renderCityList();
  body.querySelector('#citySearchInput').oninput = (e)=>{ citySearch=e.target.value; renderCityList(); };
  body.querySelector('#gpsBtn').onclick = ()=>{
    const statusEl = body.querySelector('#gpsStatus');
    if(!navigator.geolocation){
      statusEl.textContent = 'Is browser mein GPS support nahi hai.';
      return;
    }
    statusEl.textContent = 'Location maloom ki jaa rahi hai...';
    navigator.geolocation.getCurrentPosition(
      (pos)=>{
        state.location = {name:'Current Location', lat:pos.coords.latitude, lon:pos.coords.longitude, source:'gps'};
        saveState();
        renderHome(); renderCalendar();
        renderMoreSettings();
      },
      (err)=>{
        statusEl.textContent = 'Location nahi mil saki. Manually shehar chuniye.';
      },
      {timeout:10000}
    );
  };
}
function renderMoreRamzan(){
  document.getElementById('detailTitle').textContent = 'Ramzan';
  document.getElementById('detailBody').innerHTML = `
    <div class="section-title" style="margin-top:0;">Aaj ka Roza</div>
    <div class="ramzan-card" style="margin:0 0 14px;">
      <div class="roza-toggle">
        <span style="font-size:13.5px; font-weight:600;" id="rozaLabel">Roza Rakha</span>
        <div class="switch" id="rozaSwitch"><div class="knob"></div></div>
      </div>
    </div>
    <div class="section-title">Aaj ki 5 Namaz</div>
    <div id="ramzanNamazList"></div>
  `;
  renderRamzan();
}
function renderMoreAbout(){
  document.getElementById('detailTitle').textContent="Iske Baare Mein";
  document.getElementById('detailBody').innerHTML = `
    <div style="font-size:13.5px; line-height:1.8; color:var(--sub);">
      Namaz Timer App: Aapki roz ki namaz, sehri, iftar aur nawafil ke auqaat ek nazar mein.<br><br>
      Banaya gaya hai mohabbat se, taake har Musalman apni namaz waqt par ada kar sake. Allah hum sabko namaz ki hifazat karne ki taufeeq de. Ameen.
    </div>
  `;
}

document.querySelectorAll('.more-item').forEach(item=>{
  item.onclick = ()=>{
    const which = item.dataset.open;
    if(which==='dua') renderMoreDua();
    else if(which==='hadees') renderMoreHadees();
    else if(which==='quiz') renderMoreQuiz();
    else if(which==='ramzan') renderMoreRamzan();
    else if(which==='settings') renderMoreSettings();
    else if(which==='about') renderMoreAbout();
    document.getElementById('detailOverlay').classList.add('active');
  };
});
document.getElementById('detailBack').onclick = ()=>{
  document.getElementById('detailOverlay').classList.remove('active');
};

/* init calendar/ramzan lazily on first view already handled by tab click */
</script>
</body>
</html>
